<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
            <div class="navbar">
            <div class="logo">
                <a href="/index.html">Logo</a>
            </div>

            <div>
                <ul class="me">
                    <li><a href="/index.html">Home</a></li>
                    <li><a href="*"></a>Services</li>
                    <li><a href="*"></a>About us</li>
                    <li><a href="*"></a>Contact us</li>
                </ul>
            </div>

            <div class="username">
                <a href="/Sign in/signin.html">Username</a>
            </div>
    </div>
    
    
    
    
    <div class="container">
        <div class="left">
            <img src="image.png" alt="image">
        </div>
        <div class="right">
            <h2>Create an Account!</h2>
            <form action="">
                <p class="label">Enter the Name</p>
                <input type="text" name="" id="" class="inbox" placeholder="Enter the name">
                <p class="label">Enter the Mobile Number</p>
                <input type="tel" class="inbox" placeholder="Enter the Mobile Number">
                <p class="label">Enter the Email</p>
                <input type="email" name="" id="" class="inbox" placeholder="Enter the Email">
                <p class="label">Enter the Password</p>
                <input type="password" name="" id="" class="inbox" placeholder="Enter the Password">
                <p class="label">Confirm the Password</p>
                <input type="password" name="" id="" class="inbox" placeholder="Enter the Password again">
            </form>
            <button>
                Sign up
            </button>

            <p class="als">Already a Member!<a href="/Sign in/signin.html">Sign in</a></p>
        </div>
    </div>
</body>
</html>
